# Cite reviewer configuration — https://github.com/elecnix/cite
#
# The default review deadline is derived from the output cap
# (60s base + max_output_tokens / 128 tok/s; with the built-in 32768-token
# cap that is about 316s). A slower model endpoint can exceed that on a large
# file, which ends the review call and fails the run as COULD_NOT_EVALUATE.
# Raise the review timeout explicitly; everything else keeps its defaults.
roles:
  review:
    timeout: 600s
