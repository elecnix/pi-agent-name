name: dupdelta

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dupdelta:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 makes the merge-base reachable, which is what dupdelta
      # scans as "before".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: elecnix/dupdelta@c95b985a8e9ba75c1473f2fe3695d8478f869d53 # v0.3.0
