name: PR body

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# The body and the mermaid diagrams in it are read through the GitHub API.
# The checkout is only needed for the prose step, which lints the description
# against this repository's own .vale.ini.
permissions:
  contents: read
  pull-requests: read

jobs:
  pr-body:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: elecnix/gh-pr-body-action@v1
        with:
          # Prose findings block: the description is documentation too.
          prose-fail: 'true'
          node-version: '22'
