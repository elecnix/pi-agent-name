name: review

on:
  pull_request:

# Cite reviews the pull request through the GitHub API, so it needs no
# checkout of the pull-request head and executes nothing from it.
#
# Ollama Cloud is the default provider, as in the rest of the fleet, and the
# CITE_PROVIDER repository variable flips this repository to OpenRouter. The
# OpenRouter branch needs a MODEL_API_KEY secret that this repository does not
# have yet; add it before setting CITE_PROVIDER=openrouter.
permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: cite-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Review this pull request with Cite
        uses: elecnix/cite@1c0537ba7f8df4dc5db0651f609f6b8834167150  # v0.11.2
        with:
          structured_output: ${{ vars.CITE_PROVIDER == 'openrouter' && 'response_format' || 'tools' }}
          require_parameters: ${{ vars.CITE_PROVIDER == 'openrouter' }}
          model_api_key: ${{ vars.CITE_PROVIDER == 'openrouter' && secrets.MODEL_API_KEY || secrets.OLLAMA_API_KEY }}
          model_base_url: ${{ vars.CITE_PROVIDER == 'openrouter' && 'https://openrouter.ai/api/v1' || 'https://ollama.com/v1' }}
          model_id: ${{ vars.CITE_PROVIDER == 'openrouter' && 'deepseek/deepseek-v4-flash-0731' || 'deepseek-v4.1-flash' }}
