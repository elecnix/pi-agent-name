name: vale

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: vale-cli/vale-action@v3
        with:
          # Pinned to the version the configuration was validated against.
          version: 3.20.0
          # A spelling error in documentation is a real defect, so it blocks.
          fail_on_error: 'true'
          reporter: github-pr-annotations
          files: all
