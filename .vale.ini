# Vale prose configuration.
#
# Only the built-in `Vale` style is used, so no `vale sync` and no network
# access are required: the rules ship with the Vale release itself. Project
# vocabulary lives in Vocab/AgentName/accept.txt.
StylesPath = .github/styles
MinAlertLevel = warning

Vocab = AgentName

[*.md]
BasedOnStyles = Vale

# Keep the spelling rule at its default error level: a typo in documentation
# fails the check. A word the dictionary does not know is added to the
# vocabulary instead of silencing the rule.
#
# Vale.Terms enforces the house capitalization of product names, and this
# project writes the package as `pi-intercom` — lowercase, because that is the
# name npm and pi use. The rule would rewrite it, so it is off.
Vale.Terms = NO
